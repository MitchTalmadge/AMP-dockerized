services:
  amp3:
    container_name: amp3
    image: amp-v3-dockerized:beta
    build:
      context: ..
      dockerfile: Dockerfile
    platform: linux/amd64
    cgroup: host
    tty: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - ../ampdata:/opt/cubecoders/amp3/data
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "8443:8443/tcp"                 # AMP 3 web panel
      # Add the game server ports you use. Examples:
      # - "25565:25565/tcp"             # Minecraft Java
      # - "19132:19132/udp"             # Minecraft Bedrock
      # - "27015:27015/udp"             # Source games
      # - "34197:34197/udp"             # Factorio
    environment:
      PORT: "8443"
      TZ: Etc/UTC
    restart: unless-stopped
