name: Deploy Production

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - entrypoint/**
      - .github/actions/**
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Docker image tag to publish, such as v1.0.0

permissions:
  contents: read

concurrency:
  group: production-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and optionally publish
        uses: ./.github/actions/build-image
        with:
          publish: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          image: ${{ vars.DOCKERHUB_IMAGE }}
          image_tag: ${{ inputs.tag || github.ref_name }}
          release: "true"
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
