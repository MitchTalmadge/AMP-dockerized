name: Deploy Production

on:
  push:
    branches: [master]
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Docker image tag to publish, such as v1.0.0

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      # Master builds only; version tags and manual releases publish.
      for_deploy: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
      image_tag: ${{ inputs.tag || github.ref_name }}
      release: true
    secrets: inherit
