name: "Deploy Production"

on:
  push:
    branches:
      - "master"
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Docker image tag to publish, such as v1.0.0

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      # Version-tag pushes and manual deploys publish. Master pushes only build.
      for_deploy: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: "Get Tag Name"
        id: get_tag_name
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          # Leave room for the -amd64 suffix on architecture-specific tags.
          if [[ ! "$TAG_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,121}$ ]]; then
            echo "::error::The release tag is not a valid Docker image tag."
            exit 1
          fi
          printf 'TAG_NAME=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: "Download Digest Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      - name: "Deploy Tags and Manifests"
        env:
          TAG_NAME: ${{ steps.get_tag_name.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          # The build workflow pushed the architecture image by digest; attach
          # tags and manifests without pulling the image data.
          REFS=""
          for d in /tmp/digests/digests-*/*; do
            ARCH=$(basename $(dirname ${d}) | sed 's/^digests-//')
            DIGEST=$(basename ${d})
            REFS="${REFS} ${IMAGE}@sha256:${DIGEST}"
            # Arch-specific tag, e.g. :v27-amd64
            docker buildx imagetools create -t "${IMAGE}:${TAG_NAME}-${ARCH}" "${IMAGE}@sha256:${DIGEST}"
          done
          docker buildx imagetools create -t "${IMAGE}:${TAG_NAME}" -t "${IMAGE}:latest" ${REFS}
          docker buildx imagetools inspect "${IMAGE}:${TAG_NAME}"
