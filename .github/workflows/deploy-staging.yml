name: Deploy Staging

on:
  push:
    branches: ["staging*"]
    paths:
      - Dockerfile
      - .dockerignore
      - entrypoint/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/staging')
    uses: ./.github/workflows/build.yml
    with:
      for_deploy: true
      image_tag: ${{ github.ref_name }}
    secrets: inherit
