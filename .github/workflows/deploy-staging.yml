name: "Deploy Staging"

on:
  push:
    branches:
      - "staging*"
    paths:
      - Dockerfile
      - .dockerignore
      - entrypoint/**
      - .github/workflows/**.yml
  workflow_dispatch:

jobs:
  build:
    if: ${{ startsWith(github.ref, 'refs/heads/staging') }}
    uses: ./.github/workflows/build.yml
    with:
      for_deploy: true
    secrets: inherit

  deploy:
    name: "Deploy Staging"
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/heads/staging') }}
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: "Download Digest Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
      - name: "Get Branch Name"
        id: get_branch_name
        run: |
          set -euo pipefail
          BRANCH_TAG=$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/[^A-Za-z0-9_.-]+/-/g' | cut -c1-100)
          if [[ ! "$BRANCH_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::The staging branch cannot be converted to a valid Docker image tag."
            exit 1
          fi
          printf 'BRANCH_NAME=%s\n' "$BRANCH_TAG" >> "$GITHUB_OUTPUT"
      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      - name: "Deploy Tags and Manifest"
        env:
          BRANCH_NAME: ${{ steps.get_branch_name.outputs.BRANCH_NAME }}
        run: |
          set -euo pipefail
          # The build workflow pushed the architecture image by digest; attach
          # tags and manifests without pulling the image data.
          REFS=""
          for d in /tmp/digests/digests-*/*; do
            ARCH=$(basename $(dirname ${d}) | sed 's/^digests-//')
            DIGEST=$(basename ${d})
            REFS="${REFS} ${IMAGE}@sha256:${DIGEST}"
            # Arch-specific tag, e.g. :staging-amd64
            docker buildx imagetools create -t "${IMAGE}:${BRANCH_NAME}-${ARCH}" "${IMAGE}@sha256:${DIGEST}"
          done
          docker buildx imagetools create -t "${IMAGE}:${BRANCH_NAME}" ${REFS}
          docker buildx imagetools inspect "${IMAGE}:${BRANCH_NAME}"
